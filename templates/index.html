
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Webpage title -->
    <title>GeneWeaver: GPU-Accelerated CRISPR Alignment Engine</title>

    <!-- Adds favicon (small browser tab icon) -->
    <link rel="icon" type="image/jpeg"
          href="{{ url_for('static', filename='images.jpg') }}">

    <!-- Imports Bootstrap CSS for responsive styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        /* Removes default margin and padding from all elements */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Styles the complete webpage background and text */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #071c2c, #123e50, #087f70);
            color: #ffffff;
            min-height: 100vh;
            padding: 35px 15px;
        }

        /* Controls the maximum width of the main content */
        .container {
            max-width: 1050px;
        }

        /* Styles the project heading section */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Styles the main project title */
        .header h1 {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 3px 12px #00000050;
        }

        /* Highlights the GeneWeaver name in green */
        .header h1 span {
            color: #46e6b2;
        }

        /* Styles the project description */
        .header p {
            color: #c6e9e5;
            font-size: 16px;
        }

        /* Creates a box for scrolling introduction text */
        .marquee-box {
            overflow: hidden;
            white-space: nowrap;
            background: #ffffff15;
            border: 1px solid #ffffff30;
            border-radius: 10px;
            padding: 13px;
            margin-bottom: 25px;
        }

        /* Styles and animates the scrolling text */
        .marquee-text {
            display: inline-block;
            color: #75f5ca;
            font-size: 15px;
            font-weight: 600;
            padding-left: 100%;
            animation: scrolling 18s linear infinite;
        }

        /* Defines the scrolling animation movement */
        @keyframes scrolling {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100%);
            }
        }

        /* Styles the white content panels */
        .panel {
            background: #ffffff;
            color: #263746;
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 12px 35px #00000030;
            transition: transform 0.3s ease;
        }

        /* Moves the panel slightly upward when hovering */
        .panel:hover {
            transform: translateY(-3px);
        }

        /* Styles the panel headings */
        .panel h2 {
            color: #087f70;
            font-size: 23px;
            font-weight: 750;
            margin-bottom: 22px;
            border-bottom: 2px solid #e0f2ed;
            padding-bottom: 12px;
        }

        /* Styles form labels */
        label {
            display: block;
            font-weight: 650;
            margin-bottom: 9px;
            margin-top: 18px;
            color: #263746;
        }

        /* Styles text, number and file input fields */
        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd9df;
            border-radius: 9px;
            background: #f8fbfc;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Highlights an input field when selected */
        input:focus {
            border-color: #07977d;
            box-shadow: 0 0 0 4px #07977d20;
            background: #ffffff;
        }

        /* Displays a pointer when selecting a file */
        input[type="file"] {
            cursor: pointer;
        }

        /* Styles the file selection button */
        input[type="file"]::file-selector-button {
            background: #e0f5ef;
            color: #087f70;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-weight: 600;
            margin-right: 12px;
            cursor: pointer;
        }

        /* Styles the DNA scan button */
        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: linear-gradient(135deg, #087f70, #12ad88);
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Changes button appearance when hovering */
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #06685c, #079b77);
            transform: translateY(-2px);
            box-shadow: 0 7px 18px #087f7040;
        }

        /* Changes appearance when button is disabled */
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Styles success and error messages */
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            overflow-wrap: anywhere;
            color: #087f70;
        }

        /* Styles the DNA analysis summary */
        #summary {
            background: #e8f7f2;
            color: #087f70;
            padding: 14px;
            border-radius: 9px;
            font-weight: 650;
            margin-bottom: 20px;
            overflow-wrap: anywhere;
        }

        /* Allows horizontal scrolling for wide result tables */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
        }

        /* Styles the results table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            min-width: 500px;
        }

        /* Styles table headings and data cells */
        th, td {
            padding: 13px;
            border: 1px solid #e0e7eb;
            text-align: left;
            font-size: 14px;
        }

        /* Styles the table heading row */
        th {
            background: #087f70;
            color: #ffffff;
            text-transform: capitalize;
            font-weight: 700;
        }

        /* Adds alternate background colors to table rows */
        tbody tr:nth-child(even) {
            background: #f0faf7;
        }

        /* Highlights a table row when hovering */
        tbody tr:hover {
            background: #dff5ed;
        }

        /* Styles the footer section */
        .footer {
            text-align: center;
            color: #c6e9e5;
            font-size: 13px;
            margin-top: 25px;
        }

        /* Responsive design for tablets and mobile devices */
        @media (max-width: 768px) {

            body {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 25px;
            }

            .panel {
                padding: 20px;
            }

            .panel h2 {
                font-size: 20px;
            }

            .marquee-text {
                font-size: 13px;
            }
        }

        /* Reduces animations for users who prefer less motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>

<body>

    <!-- Main container holds all webpage content -->
    <div class="container">

        <!-- Project Header -->
        <div class="header">

            <!-- Displays the project name -->
            <h1>
                🧬 Gene<span>Weaver</span>
            </h1>

            <!-- Displays the project subtitle -->
            <p>
                GPU-Accelerated CRISPR Alignment Engine
            </p>

        </div>

        <!-- Displays scrolling project introduction -->
        <div class="marquee-box">

            <div class="marquee-text">
                Upload your FASTA file and scan DNA sequences
                to identify target matches using GeneWeaver.
            </div>

        </div>

        <!-- DNA scanning form section -->
        <div class="panel">

            <h2>🧪 DNA Sequence Analysis</h2>

            <!-- Form collects DNA scanning details -->
            <form id="scanForm">

                <!-- Input for target DNA sequence -->
                <label for="target">
                    Target DNA Sequence
                </label>

                <input
                    id="target"
                    name="target"
                    type="text"
                    value="ACGT"
                    placeholder="Enter target DNA sequence"
                    required
                >

                <!-- Allows the user to upload a FASTA file -->
                <label for="fasta_file">
                    📁 Upload FASTA File
                </label>

                <input
                    id="fasta_file"
                    name="fasta_file"
                    type="file"
                    accept=".fa,.fasta,.fna"
                    required
                >

                <!-- Accepts the maximum allowed mismatches -->
                <label for="max_mismatches">
                    Maximum Mismatches
                </label>

                <input
                    id="max_mismatches"
                    name="max_mismatches"
                    type="number"
                    value="3"
                    min="0"
                    required
                >

                <!-- Accepts the scanning step value -->
                <label for="step">
                    Scan Step
                </label>

                <input
                    id="step"
                    name="step"
                    type="number"
                    value="1"
                    min="1"
                    required
                >

                <!-- Submits the DNA scanning form -->
                <button type="submit" id="scanButton">
                    🔍 Scan DNA
                </button>

            </form>

            <!-- Displays scanning status and error messages -->
            <p id="message" role="status" aria-live="polite"></p>

        </div>

        <!-- Displays DNA scanning results -->
        <div class="panel">

            <h2>📊 Scan Results</h2>

            <!-- Displays number of sequences and matches -->
            <p id="summary">
                Upload a FASTA file to begin DNA analysis.
            </p>

            <!-- Table displays matching DNA regions -->
            <div class="table-container">

                <table id="resultsTable">

                    <!-- JavaScript dynamically adds column headings -->
                    <thead></thead>

                    <!-- JavaScript dynamically adds result rows -->
                    <tbody></tbody>

                </table>

            </div>

        </div>

        <!-- Project footer -->
        <div class="footer">

            <p>
                © 2026 GeneWeaver |
                GPU-Accelerated CRISPR Alignment Engine
            </p>

        </div>

    </div>


    <!-- JavaScript section handles form submission and results -->
    <script>

        // Get the DNA scanning form element
        const form = document.getElementById("scanForm");

        // Get the element used to display status messages
        const message = document.getElementById("message");

        // Get the element used to display the result summary
        const summary = document.getElementById("summary");

        // Get the scan button element
        const button = document.getElementById("scanButton");

        // Get the table heading section
        const tableHead =
            document.querySelector("#resultsTable thead");

        // Get the table body section
        const tableBody =
            document.querySelector("#resultsTable tbody");


        // Runs this function when the user submits the form
        form.addEventListener("submit", async function(event) {

            // Prevents the browser from refreshing the page
            event.preventDefault();

            // Displays a scanning message
            message.textContent = "Scanning DNA. Please wait...";

            // Displays a processing message in the summary
            summary.textContent = "Processing DNA sequences...";

            // Removes previous table headings
            tableHead.replaceChildren();

            // Removes previous table results
            tableBody.replaceChildren();

            // Disables the button to prevent multiple submissions
            button.disabled = true;

            // Changes button text while scanning
            button.textContent = "⏳ Scanning...";


            try {

                // Collects all form values, including the uploaded file
                const formData = new FormData(form);

                // Sends form data to the Flask backend API
                const response = await fetch("/api/analyze", {

                    // Uses POST to send data to the server
                    method: "POST",

                    // Sends collected form data
                    body: formData

                });

                // Converts the Flask response into JSON format
                const data = await response.json();

                // Checks whether the backend returned an error
                if (!response.ok) {

                    // Displays the backend error message
                    throw new Error(
                        data.error || "DNA scan failed."
                    );

                }

                // Displays the success message from Flask
                message.textContent = data.message;

                // Displays the total sequences and matches
                summary.textContent =
                    "Sequences scanned: " + data.sequence_count +
                    " | Total matches: " + data.results_count;


                // Checks whether the backend returned any results
                if (!data.results || data.results.length === 0) {

                    // Creates a new table row
                    const row = document.createElement("tr");

                    // Creates a new table cell
                    const cell = document.createElement("td");

                    // Displays a message when no matches are found
                    cell.textContent =
                        "No matching DNA regions found.";

                    // Makes the cell occupy one column
                    cell.colSpan = 1;

                    // Adds the cell to the row
                    row.appendChild(cell);

                    // Adds the row to the table body
                    tableBody.appendChild(row);

                    // Stops further execution
                    return;

                }


                // Gets column names from the first result object
                const columns = Object.keys(data.results[0]);

                // Creates a new row for table headings
                const headerRow = document.createElement("tr");

                // Loops through each column name
                columns.forEach(function(column) {

                    // Creates a table heading cell
                    const th = document.createElement("th");

                    // Sets the column name as heading text
                    th.textContent = column;

                    // Adds heading cell to the header row
                    headerRow.appendChild(th);

                });

                // Adds the completed heading row to the table
                tableHead.appendChild(headerRow);


                // Loops through every DNA matching result
                data.results.forEach(function(result) {

                    // Creates a new row for each result
                    const row = document.createElement("tr");

                    // Loops through every column
                    columns.forEach(function(column) {

                        // Creates a new table data cell
                        const cell = document.createElement("td");

                        // Gets the value for the current column
                        const value = result[column];

                        // Converts the value into displayable text
                        cell.textContent =
                            value === null || value === undefined
                                ? ""
                                : typeof value === "object"
                                    ? JSON.stringify(value)
                                    : String(value);

                        // Adds the cell to the current row
                        row.appendChild(cell);

                    });

                    // Adds the completed row to the results table
                    tableBody.appendChild(row);

                });


                // Checks whether the backend returned more results
                // than the number currently displayed
                if (data.results_count > data.results.length) {

                    // Displays information about the shown results
                    message.textContent +=
                        " Showing the first " +
                        data.results.length + " results.";

                }


            } catch(error) {

                // Displays an error if scanning fails
                message.textContent =
                    "Error: " + error.message;

                // Updates the summary with failure information
                summary.textContent =
                    "DNA analysis could not be completed.";

            } finally {

                // Enables the scan button again
                button.disabled = false;

                // Restores the original button text
                button.textContent = "🔍 Scan DNA";

            }

        });

    </script>

</body>
</html>
